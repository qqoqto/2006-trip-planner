    const emergencyInfo = {

        mapUrl: 'https://maps.google.com/?q=台北駐大阪經濟文化辦事處'

      emergency: [

      useful: [

      ]
    };

    // ===== MAIN APP =====
    function KansaiTripApp() {
      const [selectedDay, setSelectedDay] = useState(0);
      const [activeTab, setActiveTab] = useState('schedule');
      const [showModal, setShowModal] = useState(null); // 'expense', 'budget', 'japanese', 'emergency', 'currency'
      const [expenses, setExpenses] = useState(() => {
        try { return JSON.parse(localStorage.getItem('kansai-expenses')) || []; } catch { return []; }
      });
      const [newExpense, setNewExpense] = useState({ day: 1, category: 'food', description: '', amount: '', currency: 'JPY' });
      const [budget, setBudget] = useState(() => {
        try { return JSON.parse(localStorage.getItem('kansai-budget')) || { JPY: 100000 }; } catch { return { JPY: 100000 }; }
      });
      const [exchangeRate, setExchangeRate] = useState(() => {
        try { return parseFloat(localStorage.getItem('kansai-rate')) || 0.22; } catch { return 0.22; }
      });
      const [currencyInput, setCurrencyInput] = useState({ jpy: '', twd: '' });
      const [copyToast, setCopyToast] = useState('');
      const [emergencyNotes, setEmergencyNotes] = useState(() => {
        try { return JSON.parse(localStorage.getItem('kansai-emergency')) || { insurance: '', contact: '', notes: '' }; } catch { return { insurance: '', contact: '', notes: '' }; }
      });
      const [showInstallBanner, setShowInstallBanner] = useState(false);
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      const currentTrip = itineraryData[selectedDay];
      const currentWeather = weatherData[currentTrip.date] || [];
      const dayLabels = ['一','二','三','四','五','六','七'];

      // Save to localStorage
      useEffect(() => { localStorage.setItem('kansai-expenses', JSON.stringify(expenses)); }, [expenses]);
      useEffect(() => { localStorage.setItem('kansai-budget', JSON.stringify(budget)); }, [budget]);
      useEffect(() => { localStorage.setItem('kansai-rate', exchangeRate.toString()); }, [exchangeRate]);
      useEffect(() => { localStorage.setItem('kansai-emergency', JSON.stringify(emergencyNotes)); }, [emergencyNotes]);

      // PWA Install
      useEffect(() => {
        const handler = (e) => { e.preventDefault(); setDeferredPrompt(e); setShowInstallBanner(true); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const installApp = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        setDeferredPrompt(null);
        setShowInstallBanner(false);
      };

      // Helper functions
      const openMap = (url) => { if (url) window.open(url, '_blank'); };
      
      const copyText = (text) => {
        navigator.clipboard.writeText(text);
        setCopyToast(`已複製: ${text}`);
        setTimeout(() => setCopyToast(''), 2000);
      };

      const addExpense = () => {
        if (!newExpense.amount || !newExpense.description) return;
        setExpenses([...expenses, { ...newExpense, id: Date.now(), amount: parseFloat(newExpense.amount) }]);
        setNewExpense({ day: selectedDay + 1, category: 'food', description: '', amount: '', currency: 'JPY' });
        setShowModal(null);
      };

      const deleteExpense = (id) => setExpenses(expenses.filter(e => e.id !== id));
      const getDayExpenses = (day) => expenses.filter(e => e.day === day);
      const getTotalByCategory = (cat) => expenses.filter(e => e.category === cat).reduce((sum, e) => sum + (e.currency === 'TWD' ? e.amount / exchangeRate : e.amount), 0);
      const getTotalExpenses = () => expenses.reduce((sum, e) => sum + (e.currency === 'TWD' ? e.amount / exchangeRate : e.amount), 0);
      const getDayTotal = (day) => getDayExpenses(day).reduce((sum, e) => sum + (e.currency === 'TWD' ? e.amount / exchangeRate : e.amount), 0);

      // Currency conversion
      const convertJPY = (val) => {
        const jpy = parseFloat(val) || 0;
        setCurrencyInput({ jpy: val, twd: jpy ? (jpy * exchangeRate).toFixed(0) : '' });
      };
      const convertTWD = (val) => {
        const twd = parseFloat(val) || 0;
        setCurrencyInput({ twd: val, jpy: twd ? (twd / exchangeRate).toFixed(0) : '' });
      };

        <div style={{ minHeight: '100vh', background: 'linear-gradient(180deg, #FFF9F5 0%, #FFF0E8 50%, #FFEAE0 100%)', fontFamily: '"Noto Sans TC", sans-serif', position: 'relative', overflow: 'hidden', paddingBottom: showInstallBanner ? '80px' : '0' }}>
          
          {/* Decorative */}
          <div className="floating" style={{ position: 'absolute', top: '5%', right: '5%', fontSize: '80px', opacity: 0.15 }}>🌸</div>

            {/* Header */}

                <span style={{ background: '#F5E6DC', padding: '4px 14px', borderRadius: '20px', fontSize: '13px', color: '#8B7355' }}>2026</span>
              </div>
            </div>

            {/* Quick Tools */}
            <div style={{ display: 'flex', gap: '8px', marginBottom: '16px', justifyContent: 'center' }}>
              {[
                { id: 'currency', icon: '💱', label: '匯率' },
                { id: 'japanese', icon: '🗣️', label: '日語' },
                { id: 'emergency', icon: '🆘', label: '緊急' },
              ].map(tool => (
                <button key={tool.id} onClick={() => setShowModal(tool.id)} className="nav-btn" style={{
                  padding: '10px 16px', border: 'none', borderRadius: '12px', cursor: 'pointer',
                  background: 'rgba(255,255,255,0.8)', display: 'flex', alignItems: 'center', gap: '6px',
                  boxShadow: '0 2px 8px rgba(0,0,0,0.05)'
                }}>
                  <span style={{ fontSize: '16px' }}>{tool.icon}</span>
                  <span style={{ fontSize: '12px', color: '#5A4A40', fontWeight: 500 }}>{tool.label}</span>
                </button>
              ))}
            </div>

            {/* Date Navigation */}
            <div style={{ display: 'flex', gap: '8px', overflowX: 'auto', paddingBottom: '12px', marginBottom: '16px' }}>
              {itineraryData.map((day, index) => (
                <button key={index} onClick={() => setSelectedDay(index)} style={{
                  minWidth: '52px', padding: '10px 8px', border: 'none', borderRadius: '14px', cursor: 'pointer',
                  background: selectedDay === index ? 'linear-gradient(135deg, #E8A598 0%, #D4847A 100%)' : 'rgba(255,255,255,0.7)',
                  boxShadow: selectedDay === index ? '0 4px 15px rgba(212, 132, 122, 0.4)' : '0 2px 8px rgba(0,0,0,0.05)',
                  transform: selectedDay === index ? 'scale(1.05)' : 'scale(1)', transition: 'all 0.3s',
                }}>
                  <p style={{ fontSize: '10px', color: selectedDay === index ? '#FFF' : '#A89080', margin: '0 0 4px 0' }}>{day.weekday}</p>
                  <p style={{ fontSize: '18px', fontWeight: 700, color: selectedDay === index ? '#FFF' : '#5A4A40', margin: 0 }}>{day.date.split('/')[1]}</p>
                  {selectedDay === index && <div style={{ width: '6px', height: '6px', background: '#FFF', borderRadius: '50%', margin: '6px auto 0' }}/>}
                </button>
              ))}
            </div>

            {/* Main Card */}
            <div className="fade-in" key={selectedDay} style={{ position: 'relative', marginBottom: '16px' }}>
              <div style={{ position: 'absolute', left: '-8px', top: '50%', transform: 'translateY(-50%) rotate(-90deg)', zIndex: 2 }}>
                <span style={{ fontSize: '13px', fontWeight: 700, color: '#C4A090', letterSpacing: '4px' }}>第{dayLabels[currentTrip.day - 1]}天</span>
              </div>
              <div style={{ marginLeft: '24px', borderRadius: '20px', overflow: 'hidden', boxShadow: '0 10px 40px rgba(0,0,0,0.12)', position: 'relative' }}>
                <img src={currentTrip.image} alt={currentTrip.title} style={{ width: '100%', height: '180px', objectFit: 'cover' }}/>
                <div style={{ position: 'absolute', bottom: 0, left: 0, right: 0, background: 'linear-gradient(transparent, rgba(0,0,0,0.7))', padding: '40px 20px 16px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '6px' }}>
                    <span style={{ background: 'rgba(255,255,255,0.25)', padding: '4px 10px', borderRadius: '6px', fontSize: '11px', color: '#FFF', fontWeight: 600 }}>DAY {currentTrip.day}</span>
                    <span style={{ fontSize: '12px', color: 'rgba(255,255,255,0.9)' }}>📍 {currentTrip.location}</span>
                  </div>
                  <h2 style={{ color: '#FFF', fontSize: '18px', fontWeight: 700, margin: 0 }}>{currentTrip.title}</h2>
                </div>
              </div>
            </div>

            {/* Weather */}
            <div style={{ background: 'rgba(255,255,255,0.8)', borderRadius: '16px', padding: '14px', marginBottom: '12px' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px' }}>
                <div>
                  <h3 style={{ fontSize: '14px', fontWeight: 700, color: '#4A3728', margin: 0 }}>{currentTrip.location} 天氣</h3>

                <span style={{ fontSize: '10px', color: '#B8A090', background: '#F5EDE8', padding: '4px 8px', borderRadius: '8px' }}>預報</span>

                  <p style={{ fontSize: '11px', color: '#A89080', margin: '0 0 4px 0' }}>住宿</p>

                <span style={{ fontSize: '18px' }}>🗺️</span>

                    <div key={index} onClick={() => openMap(item.mapUrl)} className="nav-btn" style={{

                </div>
              </div>

            {/* Transport Tab */}
            {activeTab === 'transport' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>

                  <div key={index} style={{ background: 'rgba(255,255,255,0.9)', borderRadius: '14px', padding: '14px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px', marginBottom: '10px', flexWrap: 'wrap' }}>
                      <span style={{ background: '#E8D4CC', color: '#5A4A40', padding: '4px 8px', borderRadius: '6px', fontSize: '11px', fontWeight: 600 }}>{t.from}</span>
                      <span style={{ color: '#D4847A' }}>→</span>
                      <span style={{ background: '#D4847A', color: '#FFF', padding: '4px 8px', borderRadius: '6px', fontSize: '11px', fontWeight: 600 }}>{t.to}</span>
                    </div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', color: '#5A4A40' }}>

                      <p style={{ fontSize: '10px', color: '#8B7355', margin: '8px 0 0 0', padding: '6px', background: '#F9F5F2', borderRadius: '6px' }}>

                      <p style={{ fontSize: '12px', opacity: 0.85, margin: '2px 0 0 0' }}>≈ NT${Math.round(getTotalExpenses() * exchangeRate).toLocaleString()}</p>
                    </div>
                    <button onClick={() => setShowModal('budget')} style={{

            <div style={{ marginTop: '16px', display: 'flex', flexWrap: 'wrap', gap: '6px', justifyContent: 'center' }}>
              {currentTrip.highlights.map((h, i) => (
                <span key={i} style={{ background: 'rgba(232, 165, 152, 0.2)', color: '#8B5A4A', padding: '6px 14px', borderRadius: '18px', fontSize: '12px', fontWeight: 500 }}>#{h}</span>
              ))}
            </div>

            {/* Footer */}
            <div style={{ textAlign: 'center', marginTop: '24px', paddingBottom: '16px' }}>
              <p style={{ fontSize: '10px', color: '#B8A090' }}>✨ 祝旅途愉快 ✨</p>
              <p style={{ fontSize: '10px', color: '#C8B8A8', marginTop: '4px' }}>1/30 - 2/5 • 7天6夜</p>
            </div>
          </div>

          {/* ===== MODALS ===== */}

          {/* Currency Calculator Modal */}
          {showModal === 'currency' && (
            <div className="modal-overlay" onClick={() => setShowModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{ fontSize: '18px', fontWeight: 700, color: '#4A3728', margin: '0 0 20px 0', textAlign: 'center' }}>💱 匯率計算機</h3>
                
                <div style={{ background: '#F9F5F2', borderRadius: '14px', padding: '16px', marginBottom: '16px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' }}>
                    <span style={{ fontSize: '13px', color: '#8B7355' }}>匯率設定</span>
                    <span style={{ fontSize: '14px', fontWeight: 600, color: '#D4847A' }}>1 JPY = {exchangeRate} TWD</span>
                  </div>
                  <input type="range" min="0.15" max="0.35" step="0.01" value={exchangeRate}
                    onChange={e => setExchangeRate(parseFloat(e.target.value))}
                    style={{ width: '100%' }}
                  />
                </div>

                <div style={{ marginBottom: '16px' }}>
                  <label style={{ fontSize: '12px', color: '#8B7355', display: 'block', marginBottom: '6px' }}>🇯🇵 日圓 (JPY)</label>
                  <input type="number" placeholder="輸入日圓" value={currencyInput.jpy}
                    onChange={e => convertJPY(e.target.value)}
                    style={{ width: '100%', padding: '14px', border: '2px solid #E8D4CC', borderRadius: '12px', fontSize: '18px', fontWeight: 600 }}
                  />
                </div>

                <div style={{ textAlign: 'center', fontSize: '20px', margin: '12px 0' }}>⇅</div>

                <div style={{ marginBottom: '20px' }}>
                  <label style={{ fontSize: '12px', color: '#8B7355', display: 'block', marginBottom: '6px' }}>🇹🇼 台幣 (TWD)</label>
                  <input type="number" placeholder="輸入台幣" value={currencyInput.twd}
                    onChange={e => convertTWD(e.target.value)}
                    style={{ width: '100%', padding: '14px', border: '2px solid #E8D4CC', borderRadius: '12px', fontSize: '18px', fontWeight: 600 }}
                  />
                </div>

                <div style={{ background: '#F9F5F2', borderRadius: '12px', padding: '12px', fontSize: '12px', color: '#8B7355' }}>
                  <p style={{ margin: '0 0 6px 0' }}>💡 快速參考</p>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '4px', fontSize: '11px' }}>
                    <span>¥1,000 ≈ NT${Math.round(1000 * exchangeRate)}</span>
                    <span>¥5,000 ≈ NT${Math.round(5000 * exchangeRate)}</span>
                    <span>¥10,000 ≈ NT${Math.round(10000 * exchangeRate)}</span>
                    <span>¥50,000 ≈ NT${Math.round(50000 * exchangeRate)}</span>
                  </div>
                </div>

                <button onClick={() => setShowModal(null)} style={{
                  width: '100%', marginTop: '16px', padding: '14px', border: 'none', borderRadius: '12px',
                  background: 'linear-gradient(135deg, #E8A598 0%, #D4847A 100%)', color: '#FFF', fontSize: '14px', fontWeight: 600, cursor: 'pointer'
                }}>關閉</button>
              </div>
            </div>
          )}

          {/* Japanese Helper Modal */}
          {showModal === 'japanese' && (
            <div className="modal-overlay" onClick={() => setShowModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()} style={{ maxHeight: '80vh' }}>
                <h3 style={{ fontSize: '18px', fontWeight: 700, color: '#4A3728', margin: '0 0 16px 0', textAlign: 'center' }}>🗣️ 日語小幫手</h3>
                <p style={{ fontSize: '11px', color: '#A89080', textAlign: 'center', marginBottom: '16px' }}>點擊日文即可複製</p>
                
                {japanesePhrasesData.map((section, idx) => (
                  <div key={idx} style={{ marginBottom: '16px' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '10px' }}>
                      <span style={{ fontSize: '18px' }}>{section.icon}</span>
                      <span style={{ fontSize: '14px', fontWeight: 700, color: '#4A3728' }}>{section.category}</span>
                    </div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                      {section.phrases.map((phrase, i) => (
                        <div key={i} onClick={() => copyText(phrase.jp)} className="nav-btn" style={{
                          padding: '10px 12px', background: '#F9F5F2', borderRadius: '10px', cursor: 'pointer'
                        }}>
                          <p style={{ fontSize: '15px', fontWeight: 600, color: '#4A3728', margin: '0 0 2px 0' }}>{phrase.jp}</p>
                          <p style={{ fontSize: '11px', color: '#A89080', margin: '0 0 2px 0' }}>{phrase.roma}</p>
                          <p style={{ fontSize: '12px', color: '#D4847A', margin: 0 }}>{phrase.zh}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}

                <button onClick={() => setShowModal(null)} style={{
                  width: '100%', padding: '14px', border: 'none', borderRadius: '12px',
                  background: 'linear-gradient(135deg, #E8A598 0%, #D4847A 100%)', color: '#FFF', fontSize: '14px', fontWeight: 600, cursor: 'pointer'
                }}>關閉</button>
              </div>
            </div>
          )}

          {/* Emergency Modal */}
          {showModal === 'emergency' && (
            <div className="modal-overlay" onClick={() => setShowModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()} style={{ maxHeight: '85vh' }}>
                <h3 style={{ fontSize: '18px', fontWeight: 700, color: '#4A3728', margin: '0 0 16px 0', textAlign: 'center' }}>🆘 緊急資訊卡</h3>

                {/* Taiwan Office */}
                <div style={{ background: 'linear-gradient(135deg, #E8A598 0%, #D4847A 100%)', borderRadius: '14px', padding: '16px', marginBottom: '12px', color: '#FFF' }}>
                  <p style={{ fontSize: '13px', fontWeight: 700, margin: '0 0 8px 0' }}>🇹🇼 {emergencyInfo.taiwan.name}</p>
                  <p style={{ fontSize: '12px', margin: '0 0 4px 0', opacity: 0.9 }}>📞 {emergencyInfo.taiwan.phone}</p>
                  <p style={{ fontSize: '11px', margin: '0 0 4px 0', opacity: 0.85 }}>📍 {emergencyInfo.taiwan.address}</p>
                  <p style={{ fontSize: '11px', margin: '0 0 4px 0', opacity: 0.85 }}>🕐 {emergencyInfo.taiwan.hours}</p>
                  <p style={{ fontSize: '12px', margin: '8px 0 0 0', fontWeight: 600 }}>🚨 {emergencyInfo.taiwan.emergency}</p>
                  <button onClick={() => openMap(emergencyInfo.taiwan.mapUrl)} style={{
                    marginTop: '10px', padding: '8px 16px', background: 'rgba(255,255,255,0.2)', border: 'none', borderRadius: '8px',
                    color: '#FFF', fontSize: '12px', cursor: 'pointer'
                  }}>🗺️ 查看地圖</button>
                </div>

                {/* Emergency Numbers */}
                <div style={{ background: '#FFF5F5', borderRadius: '14px', padding: '14px', marginBottom: '12px' }}>
                  <p style={{ fontSize: '13px', fontWeight: 700, color: '#D4847A', margin: '0 0 10px 0' }}>📞 緊急電話</p>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    {emergencyInfo.emergency.map((e, i) => (
                      <a key={i} href={`tel:${e.number}`} style={{
                        flex: 1, padding: '12px 8px', background: '#FFF', borderRadius: '10px', textAlign: 'center', textDecoration: 'none'
                      }}>
                        <p style={{ fontSize: '20px', margin: '0 0 4px 0' }}>{e.icon}</p>
                        <p style={{ fontSize: '18px', fontWeight: 700, color: '#D4847A', margin: '0 0 2px 0' }}>{e.number}</p>
                        <p style={{ fontSize: '10px', color: '#8B7355', margin: 0 }}>{e.name}</p>
                      </a>
                    ))}
                  </div>
                </div>

                {/* Useful Contacts */}
                <div style={{ background: '#F9F5F2', borderRadius: '14px', padding: '14px', marginBottom: '12px' }}>
                  <p style={{ fontSize: '13px', fontWeight: 700, color: '#4A3728', margin: '0 0 10px 0' }}>📱 實用電話</p>
                  {emergencyInfo.useful.map((u, i) => (
                    <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: i < emergencyInfo.useful.length - 1 ? '1px solid #E8D4CC' : 'none' }}>
                      <div>
                        <p style={{ fontSize: '12px', fontWeight: 500, color: '#4A3728', margin: 0 }}>{u.name}</p>
                        <p style={{ fontSize: '10px', color: '#A89080', margin: '2px 0 0 0' }}>{u.note}</p>
                      </div>
                      <a href={`tel:${u.number}`} style={{ fontSize: '13px', fontWeight: 600, color: '#D4847A', textDecoration: 'none' }}>{u.number}</a>
                    </div>
                  ))}
                </div>

                {/* Personal Notes */}
                <div style={{ background: '#FFF', borderRadius: '14px', padding: '14px', border: '2px solid #E8D4CC' }}>
                  <p style={{ fontSize: '13px', fontWeight: 700, color: '#4A3728', margin: '0 0 12px 0' }}>📝 個人資訊 (自行填寫)</p>
                  
                  <div style={{ marginBottom: '10px' }}>
                    <label style={{ fontSize: '11px', color: '#8B7355' }}>旅遊保險資訊</label>
                    <input type="text" placeholder="保險公司、保單號碼、聯絡電話" value={emergencyNotes.insurance}
                      onChange={e => setEmergencyNotes({ ...emergencyNotes, insurance: e.target.value })}
                      style={{ width: '100%', padding: '10px', border: '1px solid #E8D4CC', borderRadius: '8px', fontSize: '13px', marginTop: '4px' }}
                    />
                  </div>
                  
                  <div style={{ marginBottom: '10px' }}>
                    <label style={{ fontSize: '11px', color: '#8B7355' }}>緊急聯絡人</label>
                    <input type="text" placeholder="姓名、電話" value={emergencyNotes.contact}
                      onChange={e => setEmergencyNotes({ ...emergencyNotes, contact: e.target.value })}
                      style={{ width: '100%', padding: '10px', border: '1px solid #E8D4CC', borderRadius: '8px', fontSize: '13px', marginTop: '4px' }}
                    />
                  </div>
                  
                  <div>
                    <label style={{ fontSize: '11px', color: '#8B7355' }}>其他備註</label>
                    <textarea placeholder="過敏資訊、慢性病用藥、信用卡掛失電話..." value={emergencyNotes.notes}
                      onChange={e => setEmergencyNotes({ ...emergencyNotes, notes: e.target.value })}
                      style={{ width: '100%', padding: '10px', border: '1px solid #E8D4CC', borderRadius: '8px', fontSize: '13px', marginTop: '4px', minHeight: '60px', resize: 'vertical' }}
                    />
                  </div>
                </div>

                <button onClick={() => setShowModal(null)} style={{
                  width: '100%', marginTop: '16px', padding: '14px', border: 'none', borderRadius: '12px',
                  background: 'linear-gradient(135deg, #E8A598 0%, #D4847A 100%)', color: '#FFF', fontSize: '14px', fontWeight: 600, cursor: 'pointer'
                }}>關閉</button>
              </div>
            </div>
          )}

          {/* Add Expense Modal */}
          {showModal === 'expense' && (
            <div className="modal-overlay" onClick={() => setShowModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{ fontSize: '18px', fontWeight: 700, color: '#4A3728', margin: '0 0 20px 0', textAlign: 'center' }}>💰 新增記帳</h3>
                
                <div style={{ marginBottom: '14px' }}>
                  <label style={{ fontSize: '12px', color: '#8B7355', display: 'block', marginBottom: '6px' }}>日期</label>
                  <select value={newExpense.day} onChange={e => setNewExpense({ ...newExpense, day: parseInt(e.target.value) })} style={{
                    width: '100%', padding: '12px', border: '2px solid #E8D4CC', borderRadius: '12px', fontSize: '14px', background: '#FFF'
                  }}>
                    {itineraryData.map((d, i) => (
                      <option key={i} value={d.day}>Day {d.day} - {d.date}</option>
                    ))}
                  </select>
                </div>

                <div style={{ marginBottom: '14px' }}>
                  <label style={{ fontSize: '12px', color: '#8B7355', display: 'block', marginBottom: '6px' }}>類別</label>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '6px' }}>
                    {categories.map(cat => (
                      <button key={cat.id} onClick={() => setNewExpense({ ...newExpense, category: cat.id })} style={{
                        padding: '10px 6px', border: newExpense.category === cat.id ? `2px solid ${cat.color}` : '2px solid #E8D4CC',
                        borderRadius: '10px', background: newExpense.category === cat.id ? `${cat.color}15` : '#FFF', cursor: 'pointer'
                      }}>
                        <p style={{ fontSize: '16px', margin: '0 0 2px 0' }}>{cat.icon}</p>
                        <p style={{ fontSize: '10px', color: '#5A4A40', margin: 0 }}>{cat.name}</p>
                      </button>
                    ))}
                  </div>
                </div>

                <div style={{ marginBottom: '14px' }}>
                  <label style={{ fontSize: '12px', color: '#8B7355', display: 'block', marginBottom: '6px' }}>說明</label>
                  <input type="text" placeholder="例：拉麵午餐" value={newExpense.description}
                    onChange={e => setNewExpense({ ...newExpense, description: e.target.value })}
                    style={{ width: '100%', padding: '12px', border: '2px solid #E8D4CC', borderRadius: '12px', fontSize: '14px' }}
                  />
                </div>

                <div style={{ marginBottom: '20px' }}>
                  <label style={{ fontSize: '12px', color: '#8B7355', display: 'block', marginBottom: '6px' }}>金額</label>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <select value={newExpense.currency} onChange={e => setNewExpense({ ...newExpense, currency: e.target.value })} style={{
                      padding: '12px', border: '2px solid #E8D4CC', borderRadius: '12px', fontSize: '14px', background: '#FFF'
                    }}>
                      <option value="JPY">¥ 日圓</option>
                      <option value="TWD">NT$ 台幣</option>
                    </select>
                    <input type="number" placeholder="0" value={newExpense.amount}
                      onChange={e => setNewExpense({ ...newExpense, amount: e.target.value })}
                      style={{ flex: 1, padding: '12px', border: '2px solid #E8D4CC', borderRadius: '12px', fontSize: '14px' }}
                    />
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '10px' }}>
                  <button onClick={() => setShowModal(null)} style={{
                    flex: 1, padding: '14px', border: '2px solid #E8D4CC', borderRadius: '12px', background: '#FFF', color: '#8B7355', fontSize: '14px', fontWeight: 600, cursor: 'pointer'
                  }}>取消</button>
                  <button onClick={addExpense} style={{
                    flex: 1, padding: '14px', border: 'none', borderRadius: '12px', background: 'linear-gradient(135deg, #E8A598 0%, #D4847A 100%)', color: '#FFF', fontSize: '14px', fontWeight: 600, cursor: 'pointer'
                  }}>確認</button>
                </div>
              </div>
            </div>
          )}

          {/* Budget Modal */}
          {showModal === 'budget' && (
            <div className="modal-overlay" onClick={() => setShowModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{ fontSize: '18px', fontWeight: 700, color: '#4A3728', margin: '0 0 20px 0', textAlign: 'center' }}>⚙️ 設定預算</h3>
                <div style={{ marginBottom: '20px' }}>
                  <label style={{ fontSize: '12px', color: '#8B7355', display: 'block', marginBottom: '6px' }}>日圓預算 (¥)</label>
                  <input type="number" value={budget.JPY}
                    onChange={e => setBudget({ ...budget, JPY: parseInt(e.target.value) || 0 })}
                    style={{ width: '100%', padding: '12px', border: '2px solid #E8D4CC', borderRadius: '12px', fontSize: '14px' }}
                  />
                </div>
                <button onClick={() => setShowModal(null)} style={{
                  width: '100%', padding: '14px', border: 'none', borderRadius: '12px',
                  background: 'linear-gradient(135deg, #E8A598 0%, #D4847A 100%)', color: '#FFF', fontSize: '14px', fontWeight: 600, cursor: 'pointer'
                }}>確認</button>
              </div>
            </div>
          )}

          {/* Copy Toast */}
          {copyToast && <div className="copy-toast">{copyToast}</div>}

          {/* Install Banner */}
          {showInstallBanner && (
            <div className="install-banner">
              <span style={{ fontSize: '24px' }}>📱</span>
              <div style={{ flex: 1 }}>
                <p style={{ fontSize: '13px', fontWeight: 600, margin: 0 }}>安裝到主畫面</p>
                <p style={{ fontSize: '11px', opacity: 0.9, margin: '2px 0 0 0' }}>離線也能使用！</p>
              </div>
              <button onClick={installApp} style={{
                padding: '8px 16px', background: '#FFF', border: 'none', borderRadius: '8px', color: '#D4847A', fontWeight: 600, cursor: 'pointer'
              }}>安裝</button>
              <button onClick={() => setShowInstallBanner(false)} style={{
                padding: '8px', background: 'transparent', border: 'none', color: '#FFF', fontSize: '18px', cursor: 'pointer'
              }}>✕</button>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<KansaiTripApp />);

    // Register Service Worker for offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'kansai-trip-v1';
          const urlsToCache = ['/'];
          self.addEventListener('install', e => e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(urlsToCache))));
          self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }
  </script>
</body>
</html>
